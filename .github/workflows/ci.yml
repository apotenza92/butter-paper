name: CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate PDF fixtures
        run: pnpm generate:fixtures

      - name: Required deterministic gate
        run: pnpm check

  manual-gui-e2e:
    name: Manual Electron E2E
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate PDF fixtures
        run: pnpm generate:fixtures

      - name: Electron E2E tests
        run: pnpm test:e2e

  manual-package-smoke:
    name: Manual package smoke (${{ matrix.platform }} ${{ matrix.arch }}, ${{ matrix.variant }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin
            arch: arm64
            variant: stable
            runner: macos-26
          - platform: darwin
            arch: x64
            variant: stable
            runner: macos-26-intel
          - platform: win32
            arch: x64
            variant: stable
            runner: windows-2025
          - platform: win32
            arch: arm64
            variant: stable
            runner: windows-11-arm
          - platform: linux
            arch: x64
            variant: stable
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            variant: stable
            runner: ubuntu-24.04-arm
          - platform: darwin
            arch: arm64
            variant: beta
            runner: macos-26
          - platform: darwin
            arch: x64
            variant: beta
            runner: macos-26-intel
          - platform: win32
            arch: x64
            variant: beta
            runner: windows-2025
          - platform: win32
            arch: arm64
            variant: beta
            runner: windows-11-arm
          - platform: linux
            arch: x64
            variant: beta
            runner: ubuntu-24.04
          - platform: linux
            arch: arm64
            variant: beta
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          cache: pnpm

      - name: Verify native runner
        shell: bash
        run: test "$(node -p 'process.arch')" = "${{ matrix.arch }}"

      - name: Install Linux package and launch tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cpio \
            binutils \
            desktop-file-utils \
            fakeroot \
            file \
            rpm \
            squashfs-tools \
            xauth \
            xvfb \
            libatk-bridge2.0-0 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxkbcommon0 \
            libxrandr2 \
            libxss1
          sudo apt-get install -y libasound2 || sudo apt-get install -y libasound2t64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate PDF fixtures
        run: pnpm generate:fixtures

      - name: Build workspace
        run: pnpm build

      - name: Build unpacked macOS application
        if: runner.os == 'macOS'
        env:
          BP_RELEASE_ARCH: ${{ matrix.arch }}
          BP_RELEASE_CHANNEL: ${{ matrix.variant }}
          BP_RELEASE_PLATFORM: ${{ matrix.platform }}
          BP_RELEASE_OUTPUT_DIR: release/${{ matrix.variant }}/${{ matrix.platform }}/${{ matrix.arch }}
          BP_REQUIRE_TUF_ROOT: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --dir apps/desktop package

      - name: Smoke test unpacked macOS application
        if: runner.os == 'macOS'
        env:
          BP_RELEASE_ARCH: ${{ matrix.arch }}
          BP_RELEASE_CHANNEL: ${{ matrix.variant }}
          BP_RELEASE_PLATFORM: ${{ matrix.platform }}
          BP_RELEASE_OUTPUT_DIR: release/${{ matrix.variant }}/${{ matrix.platform }}/${{ matrix.arch }}
        run: pnpm test:package:desktop

      - name: Build Windows installer
        if: runner.os == 'Windows'
        env:
          BP_RELEASE_ARCH: ${{ matrix.arch }}
          BP_RELEASE_CHANNEL: ${{ matrix.variant }}
          BP_RELEASE_OUTPUT_DIR: release/${{ matrix.variant }}/${{ matrix.platform }}/${{ matrix.arch }}
          BP_RELEASE_PLATFORM: ${{ matrix.platform }}
          BP_REQUIRE_TUF_ROOT: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.config.cjs --win nsis --${{ matrix.arch }} --publish never

      - name: Reject an unexpectedly oversized Windows ARM64 installer
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: bash
        run: >-
          node scripts/verify-release-package-sizes.mjs
          --arm64-installer
          "apps/desktop/release/${{ matrix.variant }}/${{ matrix.platform }}/${{ matrix.arch }}/${{ matrix.variant == 'beta' && 'Butter-Paper-Beta' || 'Butter-Paper' }}-Windows-arm64-Setup.exe"
          --label "${{ matrix.variant }} ARM64 package smoke"

      - name: Install, launch, feature-test, and uninstall Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/test-windows-installer.ps1 `
            -Arch '${{ matrix.arch }}' `
            -Channel '${{ matrix.variant }}' `
            -ReleaseDirectory 'apps/desktop/release/${{ matrix.variant }}/${{ matrix.platform }}/${{ matrix.arch }}'

      - name: Build Linux packages
        if: runner.os == 'Linux'
        env:
          BP_RELEASE_ARCH: ${{ matrix.arch }}
          BP_RELEASE_CHANNEL: ${{ matrix.variant }}
          BP_RELEASE_OUTPUT_DIR: release/${{ matrix.variant }}/${{ matrix.platform }}/${{ matrix.arch }}
          BP_RELEASE_PLATFORM: ${{ matrix.platform }}
          BP_REQUIRE_TUF_ROOT: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.config.cjs --linux AppImage deb rpm --${{ matrix.arch }} --publish never

      - name: Extract or install, launch, feature-test, and remove Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          ./scripts/test-linux-packages.sh
          'apps/desktop/release/${{ matrix.variant }}/${{ matrix.platform }}/${{ matrix.arch }}'
          '${{ matrix.variant }}'
          '${{ matrix.arch }}'

  manual-production-tuf-signing-audit:
    name: Manual production TUF signing audit
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tuf-signing-audit.yml
    secrets: inherit

  manual-nonmac-updater-audit:
    name: Manual ${{ matrix.channel }} updater audit (${{ matrix.target }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        channel:
          - stable
          - beta
        target:
          - win32-arm64
          - win32-x64
          - linux-arm64
          - linux-x64
    uses: ./.github/workflows/nonmac-updater-audit.yml
    with:
      channel: ${{ matrix.channel }}
      target: ${{ matrix.target }}
      previous_version: 0.0.11
