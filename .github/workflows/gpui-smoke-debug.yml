name: Debug GPUI package smoke

# Temporary: reruns the clean-host smoke from current main against packages
# already built by a stable-candidate run, to iterate on the harness quickly.

on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Stable-candidate run containing gpui-package-* artifacts
        required: true
        type: string
      targets:
        description: JSON array of {label, runner, os, arch}
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.targets) }}
    env:
      MIGRATION_ROOT: experiments/gpui-migration/gpui-migration
      TARGET_LABEL: ${{ matrix.label }}
      VERSION: '0.0.26'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
      - name: Install Linux runtime smoke prerequisites
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libdbus-1-3 \
            libfontconfig1 \
            libvulkan1 \
            mesa-vulkan-drivers \
            libx11-6 \
            libxcb1 \
            libxcb-xkb1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            openbox \
            xz-utils \
            xvfb \
            xauth \
            xdotool \
            x11-utils \
            qpdf
      - name: Prepare hosted Windows desktop for the smoke
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # Some hosted Windows images start at an OOBE privacy window that
          # keeps the foreground; the smoke needs the packaged app in front.
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE' -Name DisablePrivacyExperience -Type DWord -Value 1
          $before = @(Get-Process WWAHost -ErrorAction SilentlyContinue)
          $before | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $after = @(Get-Process WWAHost -ErrorAction SilentlyContinue)
          Write-Host "WWAHost processes: $($before.Count) before, $($after.Count) after"
          # Warm WMI so the smoke's first process query is not the cold one.
          $started = Get-Date
          $count = @(Get-CimInstance Win32_Process -Property ProcessId).Count
          Write-Host "WMI warm-up listed $count processes in $([int]((Get-Date) - $started).TotalSeconds)s"
      - name: Install Windows runtime smoke prerequisites
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          choco install qpdf --yes --no-progress
          $bin = Join-Path $env:ChocolateyInstall 'bin'
          if (-not $env:ChocolateyInstall) { $bin = 'C:\ProgramData\chocolatey\bin' }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin 'qpdf.exe') --version
      - name: Record macOS display capabilities
        if: matrix.os == 'macos'
        shell: bash
        run: system_profiler SPDisplaysDataType || true
      - name: Probe IconServices responsiveness
        if: matrix.os == 'macos'
        shell: bash
        run: |
          probe() {
            local started=$SECONDS
            if perl -e 'alarm 45; exec @ARGV' osascript -l JavaScript -e "ObjC.import('AppKit'); \$.NSWorkspace.sharedWorkspace.iconForFile('/Applications'); 'icon-ok'"; then
              echo "IconServices responded in $((SECONDS - started))s"
              return 0
            fi
            echo "IconServices probe failed or timed out after $((SECONDS - started))s"
            return 1
          }
          pgrep -lf iconservices || true
          if ! probe; then
            sudo launchctl kickstart -k system/com.apple.iconservices.iconservicesd || true
            launchctl kickstart -k "gui/$(id -u)/com.apple.iconservices.iconservicesagent" || true
            sleep 3
            pgrep -lf iconservices || true
            probe || true
          fi
      - name: Download package from the candidate run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gpui-package-${{ matrix.label }}
          path: ${{ runner.temp }}/candidate/${{ matrix.label }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.package_run_id }}
      - name: Generate smoke fixture
        shell: bash
        run: node scripts/generate-fixtures.mjs
      - name: Smoke package
        shell: bash
        env:
          SMOKE_ARCH: ${{ matrix.arch }}
          SMOKE_OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/candidate/$TARGET_LABEL"
          evidence="$RUNNER_TEMP/runtime-smoke/$TARGET_LABEL"
          export BP_SMOKE_SCREENSHOT_DIR="$RUNNER_TEMP/screens"
          mkdir -p "$evidence" "$BP_SMOKE_SCREENSHOT_DIR"
          if [[ "$SMOKE_OS" == macos ]]; then
            node "$MIGRATION_ROOT/scripts/smoke-signed-macos-package.mjs" \
              --archive "$artifact/butter-paper-macos-$SMOKE_ARCH-$VERSION.zip" \
              --fixture-pdf tests/fixtures/generated/single-page.pdf \
              --evidence-root "$evidence" \
              --timeout-ms 60000
          else
            if [[ "$SMOKE_OS" == linux ]]; then
              export DISPLAY=:99
              Xvfb "$DISPLAY" -screen 0 1280x800x24 -nolisten tcp \
                >"$evidence/xvfb.stdout.log" 2>"$evidence/xvfb.stderr.log" &
              xvfb_pid=$!
              cleanup_linux_desktop() {
                set +e
                kill "${openbox_pid:-}" "$xvfb_pid" 2>/dev/null
                wait "${openbox_pid:-}" "$xvfb_pid" 2>/dev/null
              }
              trap cleanup_linux_desktop EXIT
              for _ in {1..50}; do
                if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then break; fi
                sleep 0.1
              done
              xdpyinfo -display "$DISPLAY" >/dev/null
              openbox >"$evidence/openbox.stdout.log" 2>"$evidence/openbox.stderr.log" &
              openbox_pid=$!
              sleep 0.5
              kill -0 "$openbox_pid"
            fi
            package="$artifact/$TARGET_LABEL.zip"
            [[ "$SMOKE_OS" == linux ]] && package="$artifact/$TARGET_LABEL.tar.xz"
            node "$MIGRATION_ROOT/scripts/smoke-nonmac-production-package.mjs" \
              --package "$package" \
              --architecture "$SMOKE_ARCH" \
              --fixture-pdf tests/fixtures/generated/single-page.pdf \
              --evidence-root "$evidence"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debug-smoke-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/runtime-smoke/${{ matrix.label }}
            ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 3
