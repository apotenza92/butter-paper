name: Deploy Butter Paper Download Page

permissions:
  contents: read
  id-token: write
  pages: write

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yml
      - assets/icon-source/butter-paper-origami-beta.svg
      - assets/icon-source/butter-paper-origami.svg
      - docs/index.html
  workflow_dispatch:

concurrency:
  group: download-page
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Butter Paper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Prepare public site artefact
        run: |
          mkdir -p _site/assets/brand
          cp docs/index.html _site/index.html
          cp assets/icon-source/butter-paper-origami.svg _site/assets/brand/icon.svg
          cp assets/icon-source/butter-paper-origami-beta.svg _site/assets/brand/icon-beta.svg
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
