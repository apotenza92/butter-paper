name: Release

# Pushing vX.Y.Z (every target; Butter Paper and Butter Paper Beta on macOS)
# or vX.Y.Z-beta.N (Butter Paper Beta on macOS only) builds, signs and
# publishes one complete GitHub release with cargo xtask. Releases are
# immutable once published, so every asset, SHA256SUMS.txt and the attested
# Homebrew bundle go up as a draft first. The tap (apotenza92/homebrew-tap)
# is then asked to publish the casks; its registry names this workflow file.
#
# Running it by hand (workflow_dispatch) from main is a dry run: every target
# is built and packaged, unsigned, and nothing is published.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: butter-paper-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      dry_run: ${{ steps.identity.outputs.dry_run }}
      targets: ${{ steps.identity.outputs.targets }}
      required: ${{ steps.identity.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - id: identity
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          crate_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/butter-paper/Cargo.toml | head -1)"
          dry_run=false
          if [[ "$EVENT" == workflow_dispatch ]]; then
            dry_run=true
            TAG="v$crate_version"
          fi
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$ ]]; then
            prerelease=true
          else
            echo "::error::Release tags must be vX.Y.Z or vX.Y.Z-beta.N"
            exit 1
          fi
          version="${TAG#v}"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          if [[ "$dry_run" == false ]]; then
            test "$(git rev-parse "$TAG^{commit}")" = "$SOURCE_REVISION"
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG is not on main"
            exit 1
          fi
          if [[ "$crate_version" != "$version" ]]; then
            echo "::error::crates/butter-paper is $crate_version, not $version (run cargo xtask version)"
            exit 1
          fi
          if ! grep -qxF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no ## [$version] section"
            exit 1
          fi
          # Windows and Linux ship the stable app only; Butter Paper Beta is
          # macOS-only, and each macOS job packages both identities.
          if [[ "$prerelease" == true ]]; then
            targets="$(jq -c '[.[] | select(.os == "macos") | . + {channels: "beta"}]' .github/release-targets.json)"
            required="Butter-Paper-Beta-macOS-arm64.zip Butter-Paper-Beta-macOS-x64.zip"
          else
            targets="$(jq -c '[.[] | if .os == "macos" then . + {channels: "stable,beta"} else . + {channels: "stable"} end]' .github/release-targets.json)"
            required="Butter-Paper-macOS-arm64.zip Butter-Paper-macOS-x64.zip Butter-Paper-Beta-macOS-arm64.zip Butter-Paper-Beta-macOS-x64.zip Butter-Paper-Windows-x64.zip Butter-Paper-Windows-arm64.zip Butter-Paper-Linux-x64.tar.xz Butter-Paper-Linux-arm64.tar.xz"
          fi
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "dry_run=$dry_run"
            echo "targets=$targets"
            echo "required=$required"
          } >> "$GITHUB_OUTPUT"

  package:
    needs: validate
    runs-on: ${{ matrix.runner }}
    # Signing secrets are released to tag pushes only.
    environment: ${{ needs.validate.outputs.dry_run == 'false' && 'release-signing' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate.outputs.targets) }}
    env:
      CARGO_INCREMENTAL: "0"
      TARGET_TRIPLE: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.24.1
          cache: false
      - name: Install Linux build prerequisites
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang libdbus-1-dev libfontconfig-dev libvulkan-dev \
            libx11-dev libxcb1-dev libxcb-xkb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev pkg-config xz-utils
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          # rust-toolchain.toml pins the version; add the release target.
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
      # Downloads and compiled dependencies, per target, so a release mostly
      # rebuilds Butter Paper's own crates. Cargo still verifies every crate
      # against Cargo.lock.
      - name: Cache Cargo downloads and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/${{ matrix.target }}/release/deps
            target/${{ matrix.target }}/release/build
            target/${{ matrix.target }}/release/.fingerprint
            target/debug
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ matrix.target }}-
      - name: Activate matching Windows MSVC and LLVM toolchain
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.msvc_arch }}'
          if ($arch -notin @('arm64', 'x64')) { throw "unsupported MSVC architecture: $arch" }
          $component = if ($arch -eq 'arm64') {
            'Microsoft.VisualStudio.Component.VC.Tools.ARM64'
          } else {
            'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = @(& $vswhere -latest -products * -requires $component -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $installation.Count -ne 1 -or -not (Test-Path -LiteralPath $installation[0])) {
            throw "exactly one Visual Studio installation with $component is required"
          }
          $installation = $installation[0]
          $vsdev = Join-Path $installation 'Common7\Tools\VsDevCmd.bat'
          $llvmBin = Join-Path $installation "VC\Tools\Llvm\$arch\bin"
          foreach ($required in @($vsdev, (Join-Path $llvmBin 'clang.exe'))) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "required Windows build tool is missing: $required" }
          }

          $activation = Join-Path $env:RUNNER_TEMP "activate-msvc-$arch.cmd"
          @"
          @call "$vsdev" -no_logo -arch=$arch -host_arch=$arch
          @if errorlevel 1 exit /b %errorlevel%
          @set
          "@ | Set-Content -LiteralPath $activation -Encoding ascii
          $activated = @(& cmd.exe /d /s /c $activation)
          if ($LASTEXITCODE -ne 0) { throw "VsDevCmd failed for native $arch" }
          $pathValue = $null
          $exportNames = @(
            'DevEnvDir', 'ExtensionSdkDir', 'FrameworkDir', 'FrameworkDir32', 'FrameworkVersion',
            'FrameworkVersion32', 'INCLUDE', 'LIB', 'LIBPATH', 'NETFXSDKDir', 'UCRTVersion',
            'UniversalCRTSdkDir', 'VCIDEInstallDir', 'VCINSTALLDIR', 'VCToolsInstallDir',
            'VCToolsRedistDir', 'VisualStudioVersion', 'VSINSTALLDIR', 'WindowsLibPath',
            'WindowsSdkBinPath', 'WindowsSdkDir', 'WindowsSDKLibVersion', 'WindowsSdkVerBinPath',
            'WindowsSDKVersion', 'VSCMD_ARG_app_plat', 'VSCMD_ARG_HOST_ARCH',
            'VSCMD_ARG_TGT_ARCH', 'VSCMD_VER'
          )
          foreach ($line in $activated) {
            $separator = $line.IndexOf('=')
            if ($separator -le 0) { continue }
            $name = $line.Substring(0, $separator)
            $value = $line.Substring($separator + 1)
            if ($name -eq 'Path') {
              $pathValue = $value
              continue
            }
            if ($exportNames -contains $name) {
              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          if (-not $pathValue) { throw 'VsDevCmd did not emit Path' }
          $gitBash = 'C:\Program Files\Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            throw "required Git Bash is missing: $gitBash"
          }
          $pathValue.Split(';', [StringSplitOptions]::RemoveEmptyEntries) |
            ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Later GITHUB_PATH entries come first: Git Bash must win over
          # System32's WSL bash.exe, which the VsDevCmd path includes.
          Split-Path -Parent $gitBash |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$(Split-Path -Parent $gitBash);$llvmBin;$pathValue"

          $targetKey = $env:TARGET_TRIPLE.Replace('-', '_')
          "CC_$targetKey=$llvmBin\clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AR_$targetKey=lib.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$llvmBin\clang.exe" --version
          $resolvedTools = @{}
          foreach ($tool in @('link.exe', 'lib.exe')) {
            $resolved = @(where.exe $tool)
            if ($LASTEXITCODE -ne 0 -or $resolved.Count -eq 0) { throw "$tool is unavailable after VsDevCmd" }
            $resolvedTools[$tool] = $resolved[0]
            Write-Host "$tool -> $($resolved[0])"
          }
          & $gitBash --version
          $cargoTargetKey = $targetKey.ToUpperInvariant()
          "CARGO_TARGET_${cargoTargetKey}_LINKER=$($resolvedTools['link.exe'])" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Package
        if: matrix.os != 'macos' || needs.validate.outputs.dry_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask package --target "${{ matrix.target }}" --channel "${{ matrix.channels }}" --out "$RUNNER_TEMP/assets"
      - name: Package, sign and notarise
        if: matrix.os == 'macos' && needs.validate.outputs.dry_run == 'false'
        shell: bash
        env:
          APPLE_NOTARYTOOL_ISSUER_ID: ${{ vars.APPLE_NOTARYTOOL_ISSUER_ID }}
          APPLE_NOTARYTOOL_KEY_ID: ${{ vars.APPLE_NOTARYTOOL_KEY_ID }}
          APPLE_NOTARYTOOL_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARYTOOL_KEY_P8_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_SIGNING_CERTIFICATE_P12_BASE64 }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_SIGNING_CERTIFICATE_SHA256 }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for value in APPLE_NOTARYTOOL_ISSUER_ID APPLE_NOTARYTOOL_KEY_ID APPLE_NOTARYTOOL_KEY_P8_BASE64 APPLE_SIGNING_CERTIFICATE_P12_BASE64 APPLE_SIGNING_CERTIFICATE_PASSWORD APPLE_SIGNING_CERTIFICATE_SHA256 APPLE_SIGNING_IDENTITY; do test -n "${!value}"; done
          signing="$RUNNER_TEMP/signing"
          keychain="$signing/signing.keychain-db"
          mkdir -p "$signing"
          chmod 700 "$signing"
          trap 'security delete-keychain "$keychain" 2>/dev/null || true; rm -rf "$signing"' EXIT
          printf '%s' "$APPLE_SIGNING_CERTIFICATE_P12_BASE64" | base64 -D > "$signing/original.p12"
          printf '%s' "$APPLE_NOTARYTOOL_KEY_P8_BASE64" | base64 -D > "$signing/AuthKey.p8"
          printf '%s' "$APPLE_SIGNING_CERTIFICATE_PASSWORD" > "$signing/p12-password"
          chmod 600 "$signing/original.p12" "$signing/AuthKey.p8" "$signing/p12-password"
          # Re-wrap the certificate in legacy PKCS#12, which security import reads;
          # that needs OpenSSL 3 (macOS's LibreSSL has no -legacy).
          openssl=
          for candidate in /opt/homebrew/opt/openssl@3/bin/openssl /usr/local/opt/openssl@3/bin/openssl /opt/homebrew/bin/openssl /usr/local/bin/openssl; do
            if [[ -x "$candidate" ]] && "$candidate" pkcs12 -help 2>&1 | grep -q -- -legacy; then openssl="$candidate"; break; fi
          done
          test -n "$openssl"
          "$openssl" pkcs12 -legacy -in "$signing/original.p12" -passin "file:$signing/p12-password" -nodes -out "$signing/combined.pem"
          "$openssl" pkcs12 -legacy -export -in "$signing/combined.pem" -passout pass:butter-paper-disposable-import -out "$signing/import.p12" -name 'Butter Paper Developer ID'
          security create-keychain -p '' "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p '' "$keychain"
          security import "$signing/import.p12" -k "$keychain" -P butter-paper-disposable-import -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k '' "$keychain"
          read -r -a keychains <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$keychain" "${keychains[@]}"
          fingerprint="$(security find-certificate -a -Z -c "$APPLE_SIGNING_IDENTITY" "$keychain" | awk '/SHA-256 hash:/ { print $3 }' | head -1)"
          expected="$(printf '%s' "$APPLE_SIGNING_CERTIFICATE_SHA256" | tr -d ': ' | tr '[:lower:]' '[:upper:]')"
          if [[ "$fingerprint" != "$expected" ]]; then
            echo "::error::the signing certificate does not match APPLE_SIGNING_CERTIFICATE_SHA256"
            exit 1
          fi
          xcrun notarytool store-credentials bp-notary --key "$signing/AuthKey.p8" --key-id "$APPLE_NOTARYTOOL_KEY_ID" --issuer "$APPLE_NOTARYTOOL_ISSUER_ID" --keychain "$keychain"
          BP_SIGNING_IDENTITY="$APPLE_SIGNING_IDENTITY" BP_NOTARY_PROFILE=bp-notary \
            cargo xtask package --target "${{ matrix.target }}" --channel "${{ matrix.channels }}" --out "$RUNNER_TEMP/assets" --sign
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.label }}
          path: ${{ runner.temp }}/assets
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate, package]
    runs-on: ubuntu-24.04
    # The only job that can write a release, and only after every package
    # is built, signed and notarised.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: ${{ runner.temp }}/assets
          merge-multiple: true
      - name: Add the Homebrew bundle and checksums
        shell: bash
        env:
          REQUIRED: ${{ needs.validate.outputs.required }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/assets"
          read -r -a required <<< "$REQUIRED"
          expected="$(printf '%s\n' "${required[@]}" | LC_ALL=C sort)"
          actual="$(find "$assets" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          if [[ "$expected" != "$actual" ]]; then
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi
          jobs="$(printf '%s\n' "${required[@]}" | sed -n 's/^Butter-Paper-\(Beta-\)\{0,1\}macOS-\(.*\)\.zip$/package macos-\2/p' | LC_ALL=C sort -u | paste -sd, -)"
          cargo xtask publish-assets --assets "$assets" --tag "$TAG" --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --jobs "$jobs"
          ls -l "$assets"
      - name: Attest release assets
        if: needs.validate.outputs.dry_run == 'false'
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: ${{ runner.temp }}/assets/*
      - name: Publish the complete release once
        if: needs.validate.outputs.dry_run == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/assets"
          if gh release view "$TAG" -R "$REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $TAG already exists; releases are immutable, so tag a new version."
            exit 1
          fi
          awk -v heading="## [$VERSION]" '$0 == heading { found = 1; next } found && /^## \[/ { exit } found { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md"
          flags=(--draft --verify-tag --title "Butter Paper $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" -R "$REPOSITORY" "${flags[@]}" "$assets"/*
          # Every staged asset is on the draft at its exact size before publishing.
          expected="$(cd "$assets" && for file in *; do printf '%s %s\n' "$file" "$(stat -c %s "$file")"; done | LC_ALL=C sort)"
          actual="$(gh release view "$TAG" -R "$REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"' | LC_ALL=C sort)"
          if [[ "$expected" != "$actual" ]]; then
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi
          gh release edit "$TAG" -R "$REPOSITORY" --draft=false
          gh release download "$TAG" -R "$REPOSITORY" -p SHA256SUMS.txt -O "$RUNNER_TEMP/published-sums.txt"
          cmp "$RUNNER_TEMP/published-sums.txt" "$assets/SHA256SUMS.txt"
          test "$(gh api "repos/$REPOSITORY/releases/tags/$TAG" --jq '.immutable')" = true

  homebrew:
    needs: [validate, publish]
    if: needs.validate.outputs.dry_run == 'false'
    runs-on: ubuntu-24.04
    environment: homebrew-dispatch
    permissions:
      contents: read
    steps:
      - name: Mint dispatch-only tap token
        id: dispatcher
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2
        with:
          app-id: ${{ vars.HOMEBREW_DISPATCHER_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_DISPATCHER_PRIVATE_KEY }}
          owner: apotenza92
          repositories: homebrew-tap
          permission-contents: write
          permission-actions: read
      - name: Ask the tap to publish the attested casks
        shell: bash
        env:
          GH_TOKEN: ${{ steps.dispatcher.outputs.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          correlation="${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${TAG}"
          jq -n --arg product butter-paper --arg tag "$TAG" --arg release_commit "$GITHUB_SHA" \
            --arg source_run_id "$GITHUB_RUN_ID" --arg source_run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg correlation_id "$correlation" \
            '{event_type:"publish-homebrew-v1",client_payload:{product:$product,tag:$tag,release_commit:$release_commit,source_run_id:$source_run_id,source_run_attempt:$source_run_attempt,correlation_id:$correlation_id}}' |
            gh api --method POST repos/apotenza92/homebrew-tap/dispatches --input -
