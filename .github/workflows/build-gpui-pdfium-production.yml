name: Build GPUI PDFium production candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpui-pdfium-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    env:
      DEPOT_TOOLS_UPDATE: "0"
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-26
            os: macos
            cpu: arm64
            ninja_jobs: 2
            library: libpdfium.dylib
            optional: false
          - target: x86_64-apple-darwin
            runner: macos-26-intel
            os: macos
            cpu: x64
            ninja_jobs: 3
            library: libpdfium.dylib
            optional: false
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            os: windows
            cpu: arm64
            ninja_jobs: 2
            library: pdfium.dll
            optional: false
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            os: windows
            cpu: x64
            ninja_jobs: 2
            library: pdfium.dll
            optional: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            os: linux
            cpu: arm64
            ninja_jobs: 2
            library: libpdfium.so
            optional: false
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            os: linux
            cpu: x64
            ninja_jobs: 2
            library: libpdfium.so
            optional: false
    continue-on-error: ${{ matrix.optional }}

    steps:
      - name: Checkout application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record initial runner resources
        shell: bash
        run: |
          echo "runner_os=$RUNNER_OS runner_arch=$RUNNER_ARCH image_os=${ImageOS:-unknown} image_version=${ImageVersion:-unknown}"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Install Linux build prerequisites
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libatk1.0-dev libnss3-dev libx11-dev libxcomposite-dev libxdamage-dev libxext-dev libxfixes-dev libxrandr-dev libxrender-dev libxtst-dev libxkbcommon-dev

      - name: Fetch pinned depot_tools
        shell: bash
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
          git -C depot_tools checkout --detach 7575b8253e91eec32feb636c07fb515b234285da
          echo "$PWD/depot_tools" >> "$GITHUB_PATH"

      - name: Bootstrap pinned depot_tools on Unix
        if: matrix.os != 'windows'
        shell: bash
        run: |
          export DEPOT_TOOLS_DIR="$PWD/depot_tools"
          "$DEPOT_TOOLS_DIR/ensure_bootstrap"
          test "$(git -C depot_tools rev-parse HEAD)" = "7575b8253e91eec32feb636c07fb515b234285da"

      - name: Bootstrap pinned depot_tools on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\depot_tools\bootstrap\win_tools.bat"
          if ($LASTEXITCODE -ne 0) { throw "pinned depot_tools bootstrap failed" }
          $head = git -C depot_tools rev-parse HEAD
          if ($head -ne "7575b8253e91eec32feb636c07fb515b234285da") { throw "depot_tools revision changed during bootstrap" }

      - name: Resolve the installed Visual Studio toolchain
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $component = if ("${{ matrix.cpu }}" -eq "arm64") {
            "Microsoft.VisualStudio.Component.VC.Tools.ARM64"
          } else {
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64"
          }
          $instances = @(& $vswhere -latest -products * -requires $component -format json | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $instances.Count -ne 1 -or -not (Test-Path -LiteralPath $instances[0].installationPath)) {
            throw "exactly one Visual Studio installation with $component is required"
          }
          $installation = [string]$instances[0].installationPath
          $vsVersion = switch -Regex ([string]$instances[0].catalog.productLineVersion) {
            '^(17|2022)$' { '2022'; break }
            '^(18|2026)$' { '2026'; break }
            default { throw "unsupported Visual Studio product line: $($instances[0].catalog.productLineVersion)" }
          }
          "vs${vsVersion}_install=$installation" >> $env:GITHUB_ENV
          "GYP_MSVS_OVERRIDE_PATH=$installation" >> $env:GITHUB_ENV
          "GYP_MSVS_VERSION=$vsVersion" >> $env:GITHUB_ENV
          # Native ARM64 builds still run Chromium's x64 host-side tools, so
          # they require both debugger runtimes. x64 builds need only x64.
          $debuggerArchitectures = if ("${{ matrix.cpu }}" -eq "arm64") {
            @("arm64", "x64")
          } else {
            @("x64")
          }
          foreach ($debuggerCpu in $debuggerArchitectures) {
            $debuggerRuntime = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\Debuggers\$debuggerCpu\dbghelp.dll"
            if (-not (Test-Path -LiteralPath $debuggerRuntime)) {
              throw "Windows SDK Debugging Tools runtime for $debuggerCpu is required at $debuggerRuntime"
            }
          }

      - name: Fetch pinned PDFium source and dependencies
        shell: bash
        env:
          PDFIUM_REVISION: 91b9d569b34be4f38eed7b3c49b227356c3aadad
        run: |
          git clone https://pdfium.googlesource.com/pdfium.git pdfium
          git -C pdfium checkout --detach "$PDFIUM_REVISION"
          dependency_patch="$GITHUB_WORKSPACE/experiments/gpui-migration/gpui-migration/patches/pdfium-production-local-deps.patch"
          git -C pdfium apply --check "$dependency_patch"
          git -C pdfium apply "$dependency_patch"
          cat > .gclient <<'EOF'
          solutions = [{
            "name": "pdfium",
            "url": "https://pdfium.googlesource.com/pdfium.git",
            "deps_file": "DEPS",
            "managed": False,
            "custom_deps": {},
          }]
          EOF
          # gclient refuses a dirty solution root before it can evaluate the
          # patched DEPS condition. Hide only DEPS during sync, then immediately
          # restore normal index tracking and prove the exact patch survived.
          git -C pdfium update-index --assume-unchanged DEPS
          trap 'git -C pdfium update-index --no-assume-unchanged DEPS' EXIT
          gclient sync --no-history --shallow --revision "pdfium@$PDFIUM_REVISION"
          git -C pdfium update-index --no-assume-unchanged DEPS
          trap - EXIT
          test "$(git -C pdfium rev-parse HEAD)" = "$PDFIUM_REVISION"
          test "$(git -C depot_tools rev-parse HEAD)" = "7575b8253e91eec32feb636c07fb515b234285da"
          test "$(git -C pdfium diff --name-only)" = "DEPS"
          git -C pdfium apply --reverse --check "$dependency_patch"
          gclient revinfo --actual --output-json "$RUNNER_TEMP/pdfium-dependency-revisions.json"
          patch="$GITHUB_WORKSPACE/experiments/gpui-migration/gpui-migration/patches/pdfium-production-shared-library.patch"
          git -C pdfium apply --check "$patch"
          git -C pdfium apply "$patch"

      - name: Record synced source resources
        shell: bash
        run: |
          du -sh depot_tools pdfium || true
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Build PDFium shared library
        shell: bash
        env:
          NINJA_JOBS: ${{ matrix.ninja_jobs }}
        run: |
          cd pdfium
          case "${{ matrix.os }}" in
            macos) target_os="mac"; target_cpu="${{ matrix.cpu }}" ;;
            windows) target_os="win"; target_cpu="${{ matrix.cpu }}" ;;
            linux) target_os="linux"; target_cpu="${{ matrix.cpu }}" ;;
          esac
          if [[ "${{ matrix.os }}" == "linux" ]]; then
            case "${{ matrix.cpu }}" in
              arm64) sysroot_arch="arm64" ;;
              x64) sysroot_arch="amd64" ;;
            esac
            python3 build/linux/sysroot_scripts/install-sysroot.py --arch="$sysroot_arch"
          fi
          mkdir -p out/Production
          cat > out/Production/args.gn <<EOF
          pdf_is_standalone = true
          is_component_build = false
          is_debug = false
          clang_use_chrome_plugins = false
          use_remoteexec = false
          pdf_enable_v8 = false
          pdf_enable_xfa = false
          pdf_use_skia = false
          pdf_enable_fontations = false
          target_os = "$target_os"
          target_cpu = "$target_cpu"
          EOF
          if [[ "${{ matrix.os }}" == "macos" ]]; then echo 'mac_deployment_target = "13.0"' >> out/Production/args.gn; fi
          gn gen out/Production
          autoninja -C out/Production -j "$NINJA_JOBS" pdfium
          gn --version > "$RUNNER_TEMP/pdfium-gn-version.txt"
          ninja --version > "$RUNNER_TEMP/pdfium-ninja-version.txt"
          third_party/siso/cipd/siso version -online=false > "$RUNNER_TEMP/pdfium-siso-version.txt"
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            third_party/llvm-build/Release+Asserts/bin/clang-cl.exe --version > "$RUNNER_TEMP/pdfium-clang-version.txt"
          else
            third_party/llvm-build/Release+Asserts/bin/clang++ --version > "$RUNNER_TEMP/pdfium-clang-version.txt"
          fi
          case "${{ matrix.os }}" in
            macos) built=out/Production/libpdfium.dylib ;;
            windows) built=out/Production/pdfium.dll ;;
            linux) built=out/Production/libpdfium.so ;;
          esac
          test -f "$built"
          mkdir -p "$RUNNER_TEMP/pdfium-candidate/${{ matrix.target }}/notices"
          cp "$built" "$RUNNER_TEMP/pdfium-candidate/${{ matrix.target }}/${{ matrix.library }}"
          cp out/Production/args.gn "$RUNNER_TEMP/pdfium-candidate/${{ matrix.target }}/gn-args.txt"
          find . -path './.git' -prune -o -path './out' -prune -o -type f \( -name 'LICENSE' -o -name 'LICENSE.*' -o -name 'NOTICE' -o -name 'NOTICE.*' \) -print0 | sort -z | while IFS= read -r -d '' file; do
            destination="$RUNNER_TEMP/pdfium-candidate/${{ matrix.target }}/notices/${file#./}"
            mkdir -p "$(dirname "$destination")"
            cp "$file" "$destination"
          done

      - name: Record final runner resources
        if: always()
        shell: bash
        run: |
          du -sh depot_tools pdfium "$RUNNER_TEMP/pdfium-candidate" 2>/dev/null || true
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      - name: Create review metadata and unapproved manifest
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LIBRARY: ${{ matrix.library }}
          NINJA_JOBS: ${{ matrix.ninja_jobs }}
          PDFIUM_REVISION: 91b9d569b34be4f38eed7b3c49b227356c3aadad
          DEPOT_TOOLS_REVISION: 7575b8253e91eec32feb636c07fb515b234285da
          RUNNER_IMAGE: ${{ matrix.runner }}
          REPOSITORY_REVISION: ${{ github.sha }}
        run: |
          node experiments/gpui-migration/gpui-migration/scripts/prepare-pdfium-production-candidate.mjs \
            --candidate-root "$RUNNER_TEMP/pdfium-candidate/$TARGET" \
            --target "$TARGET" \
            --library "$LIBRARY" \
            --dependency-revisions "$RUNNER_TEMP/pdfium-dependency-revisions.json" \
            --shared-library-patch "$GITHUB_WORKSPACE/experiments/gpui-migration/gpui-migration/patches/pdfium-production-shared-library.patch" \
            --dependency-policy-patch "$GITHUB_WORKSPACE/experiments/gpui-migration/gpui-migration/patches/pdfium-production-local-deps.patch" \
            --gn-version-file "$RUNNER_TEMP/pdfium-gn-version.txt" \
            --ninja-version-file "$RUNNER_TEMP/pdfium-ninja-version.txt" \
            --siso-version-file "$RUNNER_TEMP/pdfium-siso-version.txt" \
            --clang-version-file "$RUNNER_TEMP/pdfium-clang-version.txt" \
            --pdfium-revision "$PDFIUM_REVISION" \
            --depot-tools-revision "$DEPOT_TOOLS_REVISION" \
            --repository-revision "$REPOSITORY_REVISION" \
            --runner-image "$RUNNER_IMAGE" \
            --runner-image-os "${ImageOS:-unknown}" \
            --runner-image-version "${ImageVersion:-unknown}" \
            --runner-os "${RUNNER_OS:-unknown}" \
            --runner-arch "${RUNNER_ARCH:-unknown}" \
            --ninja-jobs "$NINJA_JOBS" \
            --build-command "autoninja -C out/Production -j $NINJA_JOBS pdfium"

      - name: Upload immutable unapproved review candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pdfium-production-review-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pdfium-candidate/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
