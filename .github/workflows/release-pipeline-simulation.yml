name: Release pipeline simulation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pipeline-simulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare disposable release contract
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create disposable stable assets and feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p simulation/assets simulation/feed release-manifest/assets
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { dirname, join } from 'node:path';
          import { expectedReleaseAssetNames } from './scripts/release-asset-contract.mjs';

          for (const name of expectedReleaseAssetNames('stable')) {
            if (name !== 'SHA256SUMS') {
              writeFileSync(join('simulation/assets', name), `disposable release simulation: ${name}\n`);
            }
          }
          for (const channel of ['stable', 'beta']) {
            for (const platform of ['darwin', 'win32', 'linux']) {
              for (const arch of ['arm64', 'x64']) {
                const path = join('simulation/feed', channel, platform, arch, 'simulation.yml');
                mkdirSync(dirname(path), { recursive: true });
                writeFileSync(path, `channel: ${channel}\nplatform: ${platform}\narch: ${arch}\n`);
              }
            }
          }
          NODE
          (
            cd simulation/assets
            find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS
          )
          node scripts/release-asset-contract.mjs \
            --channel stable \
            --directory simulation/assets \
            > release-manifest/expected-assets.txt
          cp simulation/assets/SHA256SUMS release-manifest/assets/SHA256SUMS

      - name: Upload disposable release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulation-release-assets
          path: simulation/assets
          if-no-files-found: error
          retention-days: 1

      - name: Upload disposable update feeds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulation-release-feed-unsealed
          path: simulation/feed
          if-no-files-found: error
          retention-days: 1

      - name: Upload compact release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulation-release-manifest
          path: release-manifest
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest disposable checksums
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download compact release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simulation-release-manifest
          path: release-manifest

      - name: Attest disposable asset digests
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-checksums: release-manifest/assets/SHA256SUMS

  seal:
    name: Seal disposable update feeds
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Download only updater metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simulation-release-feed-unsealed
          path: simulation/feed

      - name: Seal disposable metadata
        shell: bash
        run: |
          find simulation/feed -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > simulation/feed/SHA256SUMS
          (cd simulation/feed && sha256sum --check --strict SHA256SUMS)

      - name: Upload sealed updater metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simulation-release-feed-sealed
          path: simulation/feed
          if-no-files-found: error
          retention-days: 1

  stage:
    name: Stage without publishing
    needs: [prepare, attest, seal]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout contract verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download disposable release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simulation-release-assets
          path: staged/assets

      - name: Download sealed updater metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simulation-release-feed-sealed
          path: staged/feed

      - name: Download compact release manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: simulation-release-manifest
          path: staged/manifest

      - name: Verify staged release without external writes
        shell: bash
        run: |
          (cd staged/assets && sha256sum --check --strict SHA256SUMS)
          (cd staged/feed && sha256sum --check --strict SHA256SUMS)
          node scripts/release-asset-contract.mjs \
            --channel stable \
            --directory staged/assets \
            > staged/actual-assets.txt
          cmp staged/manifest/expected-assets.txt staged/actual-assets.txt
          echo 'Disposable release staging passed without a tag, GitHub Release, updater-feed write, or Homebrew dispatch.'
