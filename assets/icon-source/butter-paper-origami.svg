<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 228" role="img" aria-labelledby="title description">
  <title id="title">Butter Paper origami butterfly</title>
  <desc id="description">A faceted teal origami butterfly on a coral central spine.</desc>
  <defs>
    <clipPath id="silhouette">
      <path d="M10 10 L67.5 34.4 L102.4 55.4 L128 34.4 L153.6 55.4 L188.5 34.4 L246 10 L186 118.4 L237 203.0 L188.1 183.9 L133.5 176.2 L128 217.9 L122.5 176.2 L67.9 183.9 L19 203.0 L70 118.4 Z"/>
    </clipPath>
    <linearGradient id="silhouette-base" x1="-10.6" y1="7.5" x2="266.6" y2="236.8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#98beb6"/><stop offset=".48" stop-color="#08756c"/><stop offset="1" stop-color="#03443f"/>
    </linearGradient>
    <linearGradient id="upper-left-outer" x1="10.0" y1="10.0" x2="70.0" y2="118.4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b2cec7"/><stop offset="1" stop-color="#86b2a8"/>
    </linearGradient>
    <linearGradient id="upper-left" x1="-15.6" y1="10.0" x2="128.0" y2="157.4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7fb8af"/><stop offset="1" stop-color="#27988b"/>
    </linearGradient>
    <linearGradient id="upper-right-outer" x1="246.0" y1="10.0" x2="186.0" y2="118.4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4eaaa0"/><stop offset="1" stop-color="#08756c"/>
    </linearGradient>
    <linearGradient id="upper-right" x1="271.6" y1="10.0" x2="128.0" y2="157.4" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16877c"/><stop offset="1" stop-color="#03443f"/>
    </linearGradient>
    <linearGradient id="lower-left-outer" x1="70.0" y1="118.4" x2="19.0" y2="203.0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b6b63"/><stop offset="1" stop-color="#2c9a8e"/>
    </linearGradient>
    <linearGradient id="lower-left" x1="70.0" y1="118.4" x2="122.5" y2="176.2" gradientUnits="userSpaceOnUse">
      <stop stop-color="#03443f"/><stop offset=".18" stop-color="#075d56"/><stop offset=".52" stop-color="#08756c"/><stop offset="1" stop-color="#16877c"/>
    </linearGradient>
    <linearGradient id="lower-right-outer" x1="186.0" y1="118.4" x2="237.0" y2="203.0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#033b37"/><stop offset="1" stop-color="#0a5f58"/>
    </linearGradient>
    <linearGradient id="lower-right" x1="186.0" y1="118.4" x2="133.5" y2="176.2" gradientUnits="userSpaceOnUse">
      <stop stop-color="#022e2b"/><stop offset=".18" stop-color="#033b37"/><stop offset=".52" stop-color="#034c47"/><stop offset="1" stop-color="#07675f"/>
    </linearGradient>
    <linearGradient id="center-left" x1="115.4" y1="35.2" x2="128.0" y2="217.9" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f38a72"/><stop offset="1" stop-color="#e7654c"/>
    </linearGradient>
    <linearGradient id="center-right" x1="140.6" y1="35.2" x2="128.0" y2="217.9" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e7654c"/><stop offset="1" stop-color="#a93428"/>
    </linearGradient>
  </defs>

  <!-- One base silhouette prevents seams at shared facet edges. -->
  <path d="M10 10 L67.5 34.4 L102.4 55.4 L128 34.4 L153.6 55.4 L188.5 34.4 L246 10 L186 118.4 L237 203.0 L188.1 183.9 L133.5 176.2 L128 217.9 L122.5 176.2 L67.9 183.9 L19 203.0 L70 118.4 Z" fill="url(#silhouette-base)"/>

  <!-- Four wings, each an outer and an inner plane, on one central spine. Exact mirrored nodes; no linework. -->
  <g clip-path="url(#silhouette)">
    <path d="M10 10 L67.5 34.4 L70 118.4 Z" fill="url(#upper-left-outer)"/>
    <path d="M67.5 34.4 L102.4 55.4 L111.7 93.2 L116.3 128.4 L70 118.4 Z" fill="url(#upper-left)"/>
    <path d="M246 10 L188.5 34.4 L186 118.4 Z" fill="url(#upper-right-outer)"/>
    <path d="M188.5 34.4 L153.6 55.4 L144.3 93.2 L139.7 128.4 L186 118.4 Z" fill="url(#upper-right)"/>
    <path d="M70 118.4 L67.9 183.9 L19 203.0 Z" fill="url(#lower-left-outer)"/>
    <path d="M70 118.4 L116.3 128.4 L122.5 176.2 L67.9 183.9 Z" fill="url(#lower-left)"/>
    <path d="M186 118.4 L188.1 183.9 L237 203.0 Z" fill="url(#lower-right-outer)"/>
    <path d="M186 118.4 L139.7 128.4 L133.5 176.2 L188.1 183.9 Z" fill="url(#lower-right)"/>
    <path d="M128 34.4 L102.4 55.4 L111.7 93.2 L116.3 128.4 L122.5 176.2 L128 217.9 Z" fill="url(#center-left)"/>
    <path d="M128 34.4 L153.6 55.4 L144.3 93.2 L139.7 128.4 L133.5 176.2 L128 217.9 Z" fill="url(#center-right)"/>
  </g>
</svg>
