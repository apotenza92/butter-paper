# GPUI test threads default to 2 MiB; the application renders on the
# platform main thread, which has 8 MiB. Match it so debug-build render
# depth in tests reflects the running app.
[env]
RUST_MIN_STACK = "8388608"

# Windows builds carry the C runtime, so the app starts on a PC without the
# Visual C++ redistributable (the zip installs nothing else).
[target.'cfg(all(windows, target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

[alias]
xtask = "run --quiet --package xtask --"
