releaseNotes: "### Startup performance\r

  \r

  - Made blank and PDF launches faster by delaying non-essential updater,\r

  \  registration, template, signature, and PDF services until they are needed.\r

  - Reused inspected PDF bytes during document opening to avoid reading the same\r

  \  file twice, while keeping PDF preparation available for direct file launches.\r

  \r

  ### Templates and verification\r

  \r

  - Improved long template-name layout and kept the last-template preview within\r

  \  constrained windows.\r

  - Added detailed startup timing diagnostics and expanded deterministic and\r

  \  packaged checks for blank documents, direct PDF launches, and lazy runtime\r

  \  boundaries."
