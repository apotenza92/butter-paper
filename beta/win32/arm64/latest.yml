releaseNotes: "### Rendering and navigation\r

  \r

  - Added adaptive rendering that responds to display refresh rate, available\r

  \  memory, processor capacity, render latency, and PDF.js backlog pressure.\r

  - Improved page sharpness during normal scrolling while reducing background\r

  \  prefetch and high-quality work when the device or document is under load.\r

  - Added direct arrow-key viewport scrolling, Page Up and Page Down scrolling,\r

  \  Home and End document navigation, and primary-modifier page navigation.\r

  \r

  ### Signatures and document controls\r

  \r

  - Improved phone signature drawing controls and added context-menu deletion for\r

  \  individual recent signatures.\r

  - Kept template and snapping popovers within constrained windows and removed\r

  \  obsolete blank-PDF settings compatibility code.\r

  \r

  ### Release delivery\r

  \r

  - Reduced duplicate native release checks and artifact transfers, parallelized\r

  \  post-publication verification, and added non-publishing release simulations.\r

  - Added an exact-commit candidate promotion simulation that verifies asset\r

  \  names, checksums, attestations, and update-feed sealing without publishing."
