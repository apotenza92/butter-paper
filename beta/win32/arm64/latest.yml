releaseNotes: "### Move to the native app\r

  \r

  - Moves existing Butter Paper and Butter Paper Beta installs to the native\r

  \  Butter Paper 0.0.26 app. On first launch, Butter Paper asks to update, then\r

  \  downloads the verified native package for your computer, installs it,\r

  \  removes the old Butter Paper apps and opens the new one. Your PDFs are not\r

  \  changed.\r

  - macOS 12 stays on this version, because the native app requires macOS 13 or\r

  \  later."
