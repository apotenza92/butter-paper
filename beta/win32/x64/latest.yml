releaseNotes: "- Replaced the experimental Butter Canvas surface with native blank PDFs that\r

  \  can be created in standard paper sizes, orientations, and page counts, then\r

  \  saved, annotated, and reopened through the normal document workflow.\r

  - Refined the Nova desktop shell with integrated closable and reorderable\r

  \  document tabs, configurable annotation rails, streamlined tool controls, and\r

  \  safer unsaved-document handling.\r

  - Standardized new desktop windows at 1200×800 with a 900×600 minimum while\r

  \  preserving accessible menus, popovers, dialogs, scrolling, and constrained\r

  \  layouts.\r

  - Refreshed the renderer against the official shadcn Base UI Nova registry,\r

  \  moved typography to Geist Variable, and preserved Butter Paper's custom AEC\r

  \  and document-view icon geometry.\r

  - Changed automatic-update defaults for new installations to weekly on the\r

  \  stable channel and daily on the beta channel. Existing saved preferences are\r

  \  preserved.\r

  - Expanded deterministic and hosted Electron coverage for blank-PDF lifecycle,\r

  \  document tabs, shell overflow, rail behavior, update scheduling, and\r

  \  repository UI-component hygiene."
