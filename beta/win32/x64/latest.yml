releaseNotes: "### Templates and document workflow\r

  \r

  - Added a reusable blank PDF template library with built-in and custom\r

  \  templates, PDF import, live previews, last-template reuse, and direct access\r

  \  from the document tab bar.\r

  - Added cloud-storage source detection and opening progress for large PDFs.\r

  \  Improved safe save and Save As handling around opaque file access grants.\r

  - Improved page thumbnails, blank-page previews, document opening feedback,\r

  \  constrained-window layout, and menu and rail controls.\r

  \r

  ### Markup tools and properties\r

  \r

  - Added redaction placement, locked-markup handling, calibration-line feedback,\r

  \  dimension-increment snapping, and more consistent selection hit zones.\r

  - Expanded tool properties with bundled standard annotation fonts, live text\r

  \  appearance updates, compact colour controls, persistent sortable colour\r

  \  presets, and construction-grid feedback.\r

  - Improved annotation import and export fidelity for appearance, geometry,\r

  \  rotation, text, line endings, images, snapshots, and page content.\r

  \r

  ### Verification\r

  \r

  - Added deterministic coverage for templates, saving, storage progress,\r

  \  calibration, colour presets, PDF round trips, phone-transfer limits, and\r

  \  packaged drag-and-drop behavior.\r

  - Allowed explicitly isolated local macOS GUI checks while keeping updater\r

  \  replacement tests restricted to disposable GitHub Actions runners."
