releaseNotes: "### Move to the native app\r

  \r

  - Fixes the move to the native Butter Paper 0.0.26 app, which did not start in\r

  \  0.0.27. On first launch, Butter Paper asks to update, then downloads the\r

  \  verified native package for your computer, installs it, removes the old\r

  \  Butter Paper apps and opens the new one. Your PDFs are not changed.\r

  - macOS 12 stays on this version, because the native app requires macOS 13 or\r

  \  later."
