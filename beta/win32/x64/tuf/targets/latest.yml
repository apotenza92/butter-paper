releaseNotes: "- Updated Electron to the supported 43 release line while preserving macOS 12\r

  \  compatibility.\r

  - Refreshed the development and packaging toolchain to patched releases.\r

  - Corrected the packaged TUF dependency graph and patched its glob-matching\r

  \  dependency so delegated update metadata can be evaluated safely.\r

  - Added package-boundary checks that execute delegated TUF path matching from\r

  \  the actual packaged application archive on macOS, Windows, and Linux.\r

  - Updated electron-builder to use an NSIS-compatible ARM64 payload filter,\r

  \  removing the duplicated Windows executable and DLL workaround and adding\r

  \  package-size regression gates.\r

  - Preserved isolated stable and beta application identities and updater feeds.\r

  \  Stable releases advance both feeds; beta prereleases advance only beta.\r

  - Windows and Linux users upgrading directly from 0.0.11 still need one manual\r

  \  install to bootstrap authenticated updates. Existing 0.0.13 installations\r

  \  update automatically."
