releaseNotes: "### Signatures and image appearances\r

  \r

  - Added a complete visual-signature workflow for drawing a signature, typing a\r

  \  signature with the bundled Allura face, importing a PNG or JPEG, or capturing\r

  \  a signature with a camera. Signatures remain ordinary image appearances and\r

  \  do not add certificate signing or claim cryptographic document approval.\r

  - Added automatic paper removal, ink normalization, edge smoothing, transparent\r

  \  cropping, image-dimension limits, and isolated image decoding before a\r

  \  signature can enter the document or recent-signature store.\r

  - Added up to five encrypted recent signatures with move-to-front reuse,\r

  \  explicit per-item deletion, clear-all handling, corruption checks, bounded\r

  \  operations, safe temporary files, and fail-closed behavior when secure system\r

  \  storage is unavailable.\r

  - Added the end-to-end encrypted phone-transfer client and a disabled-by-default\r

  \  Cloudflare relay package with short-lived capability URLs, authenticated\r

  \  encryption, one-time payload acknowledgement, strict size and attempt limits,\r

  \  restrictive browser headers, and rate limiting. Public builds keep phone\r

  \  transfer unavailable until a reviewed HTTPS relay origin is configured.\r

  - Added narrowly scoped macOS camera entitlement and usage descriptions. The\r

  \  runtime permission policy accepts only main-frame video from the application\r

  \  renderer and rejects microphone and unrelated permission requests.\r

  \r

  ### Markup creation and direct manipulation\r

  \r

  - Reworked rectangle, ellipse, arc, line, polygon, polyline, pen, highlight,\r

  \  image, cloud, Cloud+, and callout placement around consistent click, drag,\r

  \  completion, cancellation, and post-placement selection behavior.\r

  - Added stable three-point circular arc creation and direct arc hit testing,\r

  \  movement, and resizing. Added Shift-constrained circles and orthogonal segment\r

  \  placement without incorrectly constraining arc bulge points.\r

  - Improved polygon and polyline node placement, Enter and Escape completion,\r

  \  start-node closure, screen-space cloud closure, multiline compound-markup\r

  \  growth, and native Cloud+ leader restoration.\r

  - Added transient move and resize previews so pointer cancellation discards an\r

  \  edit and a completed drag creates only one document revision.\r

  - Improved overlapping-markup targeting with topmost hit testing, direct handle\r

  \  interaction, double-click property opening, and selection behavior that stays\r

  \  consistent between the visible preview and committed edit.\r

  - Added a tool cursor that combines a crosshair with the active markup glyph,\r

  \  and kept navigation cursors separate from drawing and direct manipulation.\r

  \r

  ### Snapping and tool properties\r

  \r

  - Added acquired tracking points, horizontal and vertical tracking paths,\r

  \  virtual intersections, edge projections, PDF-content intersections, and\r

  \  precise-role priority within a viewport-pixel snap tolerance.\r

  - Added equal-width, equal-height, equal-gap, and repeated-spacing snapping for\r

  \  new, moved, and resized annotations, with dedicated guide bars and source\r

  \  highlighting.\r

  - Separated snapping behavior from guide visibility. Users can keep snapping\r

  \  active while hiding all guides or selected guide types, and real resize nodes\r

  \  remain visible when snapping is disabled.\r

  - Added per-tool default property storage and reset controls. New annotations\r

  \  receive the active tool defaults without changing existing markups.\r

  - Refined tool property panels, snap settings, confirmation controls, keyboard\r

  \  focus, and constrained-window scrolling with standard shadcn/Base UI controls.\r

  \r

  ### Blank PDFs and page controls\r

  \r

  - Expanded blank PDF creation with A5 through A0 ordering, portrait and\r

  \  landscape controls, custom dimensions, page count, background color, and an\r

  \  exact aspect-ratio preview.\r

  - Added grid, dot, lined, isometric, and triangle paper with configurable\r

  \  spacing and alphabetized pattern colors. Generated patterns use bounded PDF\r

  \  content and reject settings that would create excessive output.\r

  - Improved page-scale presets, calibration interactions, thumbnail actions,\r

  \  pattern round trips, page rotations, and native image/snapshot appearance\r

  \  reuse.\r

  - Improved thumbnail sizing for landscape and portrait pages and aligned the\r

  \  annotation overlay with capped preview geometry.\r

  \r

  ### Desktop shell and document workflow\r

  \r

  - Added a native-height custom title bar with integrated window state,\r

  \  macOS full-screen behavior, menu-bar visibility control, and accessible\r

  \  stable and beta window identities.\r

  - Added application zoom shortcuts, protected tab and window close shortcuts,\r

  \  macOS quit handling, document Home and End navigation, neighboring-page\r

  \  navigation, and canvas copy, paste, and select-all commands.\r

  - Replaced blocking dirty-document prompts with anchored save and discard\r

  \  confirmations for tab closing and other local destructive actions.\r

  - Improved toolbar, rail, tab, menu, popover, sidebar, and page-scale behavior\r

  \  at constrained sizes. Tool shortcuts remain available from non-editing\r

  \  controls without stealing keys from text fields, overlays, or system chords.\r

  - Opened dropped PDFs in new tabs through an operating-system-backed path grant\r

  \  instead of relying on the removed renderer file-path property.\r

  - Added macOS application registration repair that removes stale stable and beta\r

  \  registrations before registering the current installed application.\r

  \r

  ### Brand, packaging, and verification\r

  \r

  - Replaced the quill artwork with the reviewed glass-document icon: a warm\r

  \  trace-paper slab, monochrome document content, a revision cloud, and a callout.\r

  \  Stable uses ruby-red annotation glass and beta uses violet annotation glass.\r

  - Added canonical 1024 px light and dark artwork, reproducible Blender scene\r

  \  sources, adaptive macOS layers, and regenerated Windows ICO, macOS ICNS,\r

  \  Linux PNG, README, and download-page assets from one checked pipeline.\r

  - Added third-party license notices for Signature Pad, Allura, QRCode, and its\r

  \  transitive QR dependency, and included the notice file in desktop packages.\r

  - Expanded release verification for camera entitlements and usage strings,\r

  \  adaptive raster icon sources, dropped-file authorization, app registration,\r

  \  signature isolation, encrypted storage, and the disabled production relay\r

  \  boundary.\r

  - Added broad deterministic coverage for markup placement, overlap handling,\r

  \  snapping, tool defaults, signatures, blank-paper patterns, window controls,\r

  \  menus, keyboard navigation, and packaging. The complete release gate now\r

  \  passes 995 deterministic application and relay tests.\r

  - Windows and Linux users upgrading directly from 0.0.11 still need one manual\r

  \  installation to bootstrap authenticated updates. Later TUF-enabled releases\r

  \  continue to update automatically."
