[package]
name = "butter-paper-pdfium-render-core"
version = "0.0.1"
edition = "2021"
description = "Minimal PDFium-backed render core CLI for Butter Paper desktop proofing"
license = "MIT"
publish = false

[[bin]]
name = "butter-paper-pdfium-render-core"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pdfium-auto = "=0.1.0"
pdfium-render = "=0.8.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
