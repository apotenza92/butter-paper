releaseNotes: "- Standardized annotation interaction chrome across tools: hovering now shows\r

  \  faint blue geometry with pale handles, selected objects use dark blue chrome\r

  \  with solid yellow handles, and a hovered handle becomes visibly actionable.\r

  - Added direct manipulation of unselected handles without forcing selection;\r

  \  clicking a handle still selects its object, and the first click after placing\r

  \  an annotation now deselects it instead of creating an accidental duplicate.\r

  - Added CAD-style multi-object selection with Shift toggling, left-to-right\r

  \  contained selection, right-to-left crossing selection, freeform lasso,\r

  \  explicit add/remove zones, directional blue/green styling, operation badges,\r

  \  and cursor-following hotkey guidance.\r

  - Simplified the annotation rails into stable Review and Draw groups while\r

  \  preserving resizing, overflow access, tooltips, accessibility, and the custom\r

  \  Butter Paper tool icons.\r

  - Restored saved desktop window size and position safely across launches and\r

  \  display changes, while retaining the reviewed default and minimum geometry.\r

  - Reworked cloud scallops as continuous cubic lobes with matching sampled hit\r

  \  geometry for a cleaner Bluebeam-style appearance and dependable selection.\r

  - Expanded deterministic and hosted Electron coverage for annotation creation,\r

  \  hover and handle behavior, multi-selection geometry, window restoration,\r

  \  rail layout, keyboard accessibility, and shell overflow."
