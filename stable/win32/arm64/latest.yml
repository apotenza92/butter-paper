releaseNotes: "### Move to the native app\r

  \r

  - Windows: the move to the native app now finishes. In 0.0.27 to 0.0.31 the\r

  \  installer that should take over after Butter Paper closed never started,\r

  \  so every launch downloaded the new app again and nothing changed.\r

  - Moves to the native Butter Paper 0.1.3 app automatically after this update\r

  \  restarts. Native 0.1.3 then keeps itself up to date. Your PDFs are not\r

  \  changed.\r

  - This is the last Electron release."
