releaseNotes: "- Redesigned the PDF workspace with clearer toolbar and rail organisation,\r

  \  resizable property panels, concise control hints, constrained menus, and\r

  \  consistent Base UI Nova controls.\r

  - Expanded annotation workflows with improved snapping and visible snap\r

  \  markers, richer property controls, context menus, page rotation, refined\r

  \  selection and markup geometry, and stronger Cloud, Cloud+, Callout, and\r

  \  measurement behaviour.\r

  - Added a complete blank-PDF workflow with reusable page settings and integrated\r

  \  it with document tabs, thumbnails, open, Save As, and normal PDF.js rendering.\r

  - Removed the unused native Rust/PDFium renderer so the desktop app has one\r

  \  supported PDF.js rendering path, fewer native build requirements, and no\r

  \  dormant backend selector.\r

  - Hardened renderer file access with owner-scoped document and Save As\r

  \  capabilities instead of renderer-supplied privileged paths.\r

  - Added development source freshness checks, exact build provenance in the\r

  \  development window title, stale-renderer rejection, and repeatable desktop\r

  \  performance measurements for empty, one-page, and 100-page workloads.\r

  - Replaced the stable and beta application icons with refreshed,\r

  \  channel-specific artwork across macOS, Windows, and Linux, and added a public\r

  \  download page with deterministic copy and asset checks.\r

  - Expanded deterministic and hosted GUI coverage for the redesigned shell,\r

  \  properties, snapping, context menus, blank PDFs, page layouts, accessibility,\r

  \  constrained windows, and application provenance."
