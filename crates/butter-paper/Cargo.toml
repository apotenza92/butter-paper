[package]
name = "butter-paper"
version = "0.5.1"
edition = "2024"
publish = false
license = "MIT"

[features]
default = ["development-pdfium-override"]
benchmark-evidence = ["gpui/profiler"]
# Development only: the scripted in-app review driver captures its own windows.
review-driver = ["gpui/test-support", "gpui_platform/test-support"]
development-pdfium-override = []

[dependencies]
aes-gcm = { version = "0.11.1", features = ["zeroize"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
qrcode = { version = "0.14.1", default-features = false }
getrandom = "0.3"
async-channel = "2.5.0"
base64 = "0.22.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
cosmic-text = "0.19.0"
crc32fast = "1.5.1"
dirs = "6.0.0"
dunce = "1.0.5"
flate2 = "1.1.10"
gpui = { git = "https://github.com/zed-industries/zed", rev = "8b1497dbd22fb06f5838a7c0b84a1e54fafa71bc", default-features = false, features = ["wayland", "x11", "windows-manifest"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "8b1497dbd22fb06f5838a7c0b84a1e54fafa71bc", default-features = false, features = ["font-kit", "wayland", "x11"] }
gpui-component = { git = "https://github.com/apotenza92/gpui-kit", rev = "f30c8e026298f01dfda8d1a2948677871dfd0f69" }
gpui-component-assets = { git = "https://github.com/apotenza92/gpui-kit", rev = "f30c8e026298f01dfda8d1a2948677871dfd0f69" }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
keyring = { version = "=3.6.3", features = ["apple-native", "crypto-rust", "sync-secret-service", "windows-native"] }
libc = "0.2"
lopdf = { version = "=0.45.0", default-features = false }
memmap2 = "0.9.8"
pdfium-render = { git = "https://github.com/ajrcarey/pdfium-render", rev = "6cee8b9a3951832ac0ff62ce4c32800278001cb8", version = "=0.9.4", default-features = false, features = ["pdfium_7881"] }
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
# Digital signatures (PDF signing and validation). The `cms` and `rsa`
# releases are pinned pre-releases of the current RustCrypto line (`cms`
# matches the one `p12-keystore` reads PKCS#12 files with),
# which uses `sha2` 0.11 (`signature_sha2` here).
cms = { version = "=0.3.0-pre.1", default-features = false, features = ["std"] }
const-oid = { version = "0.10", features = ["db"] }
der = { version = "0.8", features = ["alloc", "derive", "oid"] }
ecdsa = { version = "0.17", features = ["der", "digest"] }
p256 = { version = "0.14", features = ["ecdsa"] }
p384 = { version = "0.14", features = ["ecdsa"] }
rsa = { version = "=0.10.0-rc.19", features = ["sha2"] }
sha1 = { version = "0.11", features = ["oid"] }
signature_sha2 = { package = "sha2", version = "0.11", features = ["oid"] }
spki = "0.8"
x509-cert = { version = "0.3", features = ["builder"] }
p12-keystore = "0.4.1"
rustls-native-certs = "0.8"
roxmltree = "0.21"
serde_json = "1.0"
smallvec = "1.15.1"
rustybuzz = "=0.20.1"
ttf-parser = "=0.25.1"
unicode-bidi = "=0.3.18"
zeroize = "1.9.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
security-framework = { version = "3.7.0", features = ["macos-12"] }

[target.'cfg(windows)'.dependencies]
# GPUI Component's icons embedded in debug builds too: otherwise they are read
# at run time from the build machine's path, so a debug build cross-built for
# a Windows test machine draws no checkmarks or chevrons.
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.11"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "8b1497dbd22fb06f5838a7c0b84a1e54fafa71bc", default-features = false, features = ["test-support", "wayland", "x11", "windows-manifest"] }

gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "8b1497dbd22fb06f5838a7c0b84a1e54fafa71bc", default-features = false, features = ["test-support", "font-kit", "wayland", "x11"] }

[lints]
workspace = true
