[workspace]
resolver = "3"
members = ["crates/butter-paper", "crates/ztracing-shim", "xtask"]
default-members = ["crates/butter-paper"]

# GPUI render and handler code routinely takes many arguments and nested
# closure types; Zed allows the same two lints.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

# GPUI is Zed 8b1497d plus Butter Paper's patches (apotenza92/zed, branch
# butter-paper). gpui-component names the upstream Zed URL too, so every Zed
# crate is redirected to the fork to keep a single GPUI.
[patch."https://github.com/zed-industries/zed"]
# Zed's tracing facade is GPL; this Apache shim replaces it.
ztracing = { path = "crates/ztracing-shim" }
collections = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
derive_refineable = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
gpui = { version = "=0.2.2", git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
gpui_apple = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
gpui_linux = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
gpui_macos = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
gpui_macros = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
gpui_platform = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
gpui_shared_string = { version = "=0.1.0", git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
gpui_util = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
gpui_web = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
gpui_wgpu = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
gpui_windows = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
http_client = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
media = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
perf = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
refineable = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
scheduler = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
sum_tree = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }
util_macros = { git = "https://github.com/apotenza92/zed", rev = "95daccfc6a3c4fb6417e31f46c9c1dd54b7714a8" }

# The fork's own crates name ztracing within its workspace; replace it there too.
[patch."https://github.com/apotenza92/zed"]
ztracing = { path = "crates/ztracing-shim" }

# No debug info keeps linking GPUI within small machines' memory; incremental
# builds keep edit-rebuild cycles in the large workspace modules short.
[profile.dev]
debug = 0
strip = "symbols"

# Dependencies (GPUI above all) are optimised even in debug builds, so a
# debug build renders and drags at full frame rate; Butter Paper's own crate
# stays unoptimised and quick to rebuild.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.butter-paper]
opt-level = 1

[profile.test]
debug = 0
strip = "symbols"
